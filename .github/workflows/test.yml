name: test

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

# 同一分支有新提交时取消上一轮，避免浪费额度
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest

    strategy:
      # 任一版本失败即整体失败
      fail-fast: false
      matrix:
        # 覆盖 README 声明的最低版本到当前主流版本
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Syntax check
        run: python -m compileall -q ai cache config crud models routers schemas utils

      # 测试为纯 mock 策略，不依赖 MySQL / Redis，可直接运行
      - name: Run pytest
        run: pytest -v --tb=short

  # 只在主分支跑一次冒烟，确认应用可以被正常加载
  smoke:
    name: smoke - app imports
    runs-on: ubuntu-latest
    needs: pytest
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Import app and verify routes
        # 路由清单位于 scripts/check_routes.py，CI 和单元测试共用同一份。
        # 之前两边各自硬编码路由数，加接口要改两处、漏一处就红，已经失败过两次。
        run: python -m scripts.check_routes